name: HAKHAMANESH Android Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create Android project
        run: flutter create --org com.parsic --project-name parsic --platforms android .

      - name: Install HAKHAMANESH keyboard
        run: |
          mkdir -p android/app/src/main/res/xml
          mkdir -p android/app/src/main/res/values
          mkdir -p android/app/src/main/kotlin/com/parsic/parsic

          cp native/kotlin/ParsicKeyboardService.kt \
            android/app/src/main/kotlin/com/parsic/parsic/

          cp native/res/xml/method.xml \
            android/app/src/main/res/xml/method.xml

          cp native/res/values/strings.xml \
            android/app/src/main/res/values/strings.xml

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          app_match = re.search(r'<application\b[^>]*>', s)
          if not app_match:
              raise SystemExit("Android application tag not found")

          app_tag = app_match.group(0)
          if re.search(r'android:label="[^"]*"', app_tag):
              app_tag = re.sub(
                  r'android:label="[^"]*"',
                  'android:label="@string/app_name"',
                  app_tag
              )
          else:
              app_tag = app_tag[:-1] + ' android:label="@string/app_name">'

          s = s[:app_match.start()] + app_tag + s[app_match.end():]

          s = re.sub(
              r'\s*<service\b(?=[^>]*ParsicKeyboardService)[\s\S]*?</service>',
              '',
              s
          )

          service = """
              <service
                  android:name="com.parsic.parsic.ParsicKeyboardService"
                  android:label="@string/ime_name"
                  android:permission="android.permission.BIND_INPUT_METHOD"
                  android:exported="true">
                  <intent-filter>
                      <action android:name="android.view.InputMethod" />
                  </intent-filter>
                  <meta-data
                      android:name="android.view.im"
                      android:resource="@xml/method" />
              </service>
          """

          s = s.replace("</application>", service + "\n</application>")
          p.write_text(s)

          main = Path(
              "android/app/src/main/kotlin/com/parsic/parsic/MainActivity.kt"
          )
          main.parent.mkdir(parents=True, exist_ok=True)

          main.write_text('''package com.parsic.parsic

          import android.content.Context
          import android.view.inputmethod.InputMethodManager
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel

          class MainActivity: FlutterActivity() {
              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)

                  MethodChannel(
                      flutterEngine.dartExecutor.binaryMessenger,
                      "parsic/keyboard"
                  ).setMethodCallHandler { call, result ->
                      if (call.method == "openKeyboard") {
                          val imm = getSystemService(
                              Context.INPUT_METHOD_SERVICE
                          ) as InputMethodManager
                          imm.showInputMethodPicker()
                          result.success(true)
                      } else {
                          result.notImplemented()
                      }
                  }
              }
          }
          ''')
          PY

      - name: Build release APK
        run: |
          flutter pub get
          flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: HAKHAMANESH-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
